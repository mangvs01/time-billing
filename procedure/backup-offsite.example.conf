# Exemple seulement — ne pas utiliser tel quel.
# Copier vers /etc/time-billing-backup.env, compléter, puis chmod 600 et chown root:root.
# Destination retenue : OneDrive personnel via rclone.
RESTIC_REPOSITORY="rclone:Onedrive:TimeBilling/production"
RCLONE_CONFIG="/etc/time-billing-backup/rclone.conf"
RESTIC_PASSWORD_FILE="/etc/time-billing-backup/restic-password"
# Seul un remote rclone est autorisé (rclone:Remote:chemin) ; s3: et AWS_* sont refusés (code 2).
RESTIC_READ_DATA_SUBSET="1/10"
KEEP_DAILY="30"
KEEP_MONTHLY="12"

# Alertes d'échec par e-mail. Port 587 + STARTTLS est le défaut recommandé.
TB_SMTP_HOST="smtp.gmail.com"
TB_SMTP_PORT="587"
# TB_SMTP_TLS admis : starttls | ssl | none (pas de commentaire en fin de ligne : la configuration est lue strictement).
TB_SMTP_TLS="starttls"
TB_SMTP_FROM="oguzhannakin@gmail.com"
TB_ALERT_TO="oguzhannakin@gmail.com"
TB_SMTP_USER="oguzhannakin@gmail.com"
TB_SMTP_PASSWORD="<mot-de-passe-application-Gmail>"
