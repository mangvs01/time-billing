<script nonce="{{csp_nonce}}">/* rc14 : chaque libellé de champ est relié à son champ (lecteurs d'écran, clic sur le libellé) */document.querySelectorAll('.field>label:not([for])').forEach(function(l,i){if(l.querySelector('input,select,textarea'))return;var c=l.parentElement.querySelector('input:not([type=hidden]):not([type=radio]):not([type=checkbox]),select,textarea');if(!c)return;if(!c.id)c.id='fld-'+i+'-'+(c.name||'x');l.htmlFor=c.id});/* UX lot 1 (n° 1) : une cellule de tableau « cartes » sans libellé reçoit celui de son en-tête (pages de détail comprises) */document.querySelectorAll('table.cards').forEach(function(t){if(!t.rows.length)return;var h=Array.prototype.map.call(t.rows[0].cells,function(c){return c.textContent.trim()});Array.prototype.slice.call(t.rows,1).forEach(function(r){var i=0;Array.prototype.forEach.call(r.cells,function(c){if(!c.dataset.label&&c.colSpan===1)c.dataset.label=h[i]||'';i+=c.colSpan})})});document.addEventListener('submit',function(e){var m=e.target&&e.target.dataset&&e.target.dataset.confirm;if(m&&!window.confirm(m))e.preventDefault()},true)</script>
{% if kept %}<script nonce="{{csp_nonce}}" type="application/json" id="tb-kept">{{kept|tojson}}</script><script nonce="{{csp_nonce}}">(function(){var k=JSON.parse(document.getElementById('tb-kept').textContent),changed=[];Array.prototype.forEach.call(document.forms,function(f){var a=f.getAttribute('action')||location.pathname;if(a!==k.path)return;Array.prototype.forEach.call(f.elements,function(el){if(!el.name||!(el.name in k.data)||el.type==='hidden'||el.type==='file'||el.type==='submit')return;var v=k.data[el.name];if(el.type==='radio'){if(el.value!==v)return;el.checked=true}else if(el.type==='checkbox'){el.checked=true}else{el.value=v}changed.push(el)})});changed.forEach(function(el){el.dispatchEvent(new Event('change',{bubbles:true}));el.dispatchEvent(new Event('input',{bubbles:true}))})})()</script>{% endif %}
